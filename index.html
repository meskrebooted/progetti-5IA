<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progetti 5IA · meskrebooted</title>
<meta name="description" content="Progetti 5IA di meskrebooted, aggiornati in automatico da GitHub.">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#0f1722; --muted:#5b6675; --line:#e1e5ea;
    --accent:#1d4ed8; --accent-soft:#e8eefc; --radius:10px;
    --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b0f16; --panel:#121823; --ink:#e8edf4; --muted:#8c98a9; --line:#1f2836; --accent:#6ea0ff; --accent-soft:#16213a;}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
  .wrap{max-width:60rem;margin:0 auto;padding:0 1.5rem}

  header{border-bottom:1px solid var(--line);background:var(--panel)}
  header .wrap{padding-top:4.5rem;padding-bottom:3rem}
  h1{font-size:clamp(2.2rem,6vw,3.5rem);line-height:1.05;letter-spacing:-.035em;font-weight:700;margin:0 0 1rem}
  .lead{max-width:36rem;color:var(--muted);margin:0 0 1.75rem;font-size:1.05rem}
  .actions{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--line);
       color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem;background:var(--panel);transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .btn svg{width:18px;height:18px;fill:currentColor}
  .btn-orange{background:#f97316;border-color:#f97316;color:#fff}
  .btn-orange:hover{background:#ea580c;border-color:#ea580c}
  .count{font:.85rem var(--mono);color:var(--muted)}

  main{padding:3rem 0 5rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(18.5rem,1fr));gap:1.25rem;list-style:none;margin:0;padding:0}
  .card{display:flex;flex-direction:column;height:100%;padding:1.4rem;background:var(--panel);border:1px solid var(--line);
        border-radius:var(--radius);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
  .card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
  .card:focus-visible{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px var(--accent)}
  .card h2{font-size:1.1rem;line-height:1.3;margin:0 0 .5rem;font-weight:650;letter-spacing:-.01em;word-break:break-word}
  .card p{margin:0 0 1.25rem;color:var(--muted);font-size:.95rem;flex:1}
  .meta{display:flex;justify-content:space-between;gap:.75rem;align-items:center;padding-top:1rem;border-top:1px solid var(--line);
        font-size:.82rem;color:var(--muted)}
  .lang{display:inline-flex;align-items:center;gap:.4rem;font-weight:550;color:var(--ink)}
  .lang i{width:.6rem;height:.6rem;border-radius:50%;background:var(--accent)}
  .live{display:inline-block;margin-top:.25rem}

  .state{padding:3rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
  .skeleton{height:10rem;border-radius:var(--radius);background:linear-gradient(90deg,var(--panel),var(--accent-soft),var(--panel));
            background-size:200% 100%;animation:sh 1.4s infinite linear;border:1px solid var(--line)}
  @keyframes sh{to{background-position:-200% 0}}
  footer{border-top:1px solid var(--line);padding:1.5rem 0 calc(1.5rem + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.85rem}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Progetti 5IA</h1>
    <p class="lead">Una raccolta dei miei lavori più recenti, aggiornata in automatico dai repository GitHub.</p>
    <div class="actions">
      <a class="btn" href="https://github.com/meskrebooted">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        Profilo GitHub
      </a>
      <a class="btn btn-orange" href="https://mesko.altervista.org">Passa al sito Altervista <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.22 2.97a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 1 1-1.06-1.06l2.97-2.97H3.75a.75.75 0 0 1 0-1.5h7.44L8.22 4.03a.75.75 0 0 1 0-1.06z"/></svg></a>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <ul class="grid" id="list" aria-label="Elenco progetti">
      <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
    </ul>
  </div>
</main>

<footer><div class="wrap">Dati letti dall'API pubblica di GitHub.</div></footer>

<script>
  const USERNAME = "meskrebooted";
  const FILTRO = "-5IA"; // mostra solo i repo con questo testo nel nome

  const list = document.getElementById("list");
  const count = document.getElementById("count");
  const fmt = d => new Date(d).toLocaleDateString("it-IT", {day:"numeric", month:"short", year:"numeric"});
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const msg = t => { list.outerHTML = `<div class="state" id="list">${t}</div>`; count.textContent = ""; };

  fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=pushed`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(repos => {
      const mine = repos
        .filter(r => r.name.toLowerCase().includes(FILTRO.toLowerCase()))
        .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
      if (!mine.length) return msg(`Nessun progetto con "${esc(FILTRO)}" nel nome, per ora.`);
      count.textContent = mine.length + (mine.length === 1 ? " progetto" : " progetti");
      list.innerHTML = mine.map(r => `
        <li><a class="card" href="${esc(r.html_url)}">
          <h2>${esc(r.name)}</h2>
          <p>${esc(r.description) || "Nessuna descrizione."}</p>
          <div class="meta">
            <span class="lang">${r.language ? `<i></i>${esc(r.language)}` : ""}</span>
            <span>Aggiornato ${fmt(r.pushed_at)}</span>
          </div>
        </a></li>`).join("");
    })
    .catch(() => msg("Impossibile caricare i progetti da GitHub. Ricarica la pagina tra qualche minuto."));
</script>
</body>
</html>
