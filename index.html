<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progetti 5IA · GitHub</title>
<meta name="description" content="Progetti 5IA di meskrebooted, aggiornati in automatico da GitHub.">
<style>
  /* ---------- Tema ---------- */
  /* Blu, chiaro o scuro in base al dispositivo */
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#0f1722; --muted:#5b6675; --line:#e1e5ea;
    --accent:#1d4ed8; --accent-soft:#e8eefc;
    --sw-bg:#f97316; --sw-line:#f97316; --sw-ink:#ffffff; --sw-hover:#ea580c; --sw-hover-ink:#ffffff;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b0f16; --panel:#121823; --ink:#e8edf4; --muted:#8c98a9; --line:#1f2836; --accent:#6ea0ff; --accent-soft:#16213a;}
  }

  /* ---------- Base ---------- */
  :root{
    --radius:10px;
    --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
  .wrap{max-width:60rem;margin:0 auto;padding:0 1.5rem}

  /* ---------- Intestazione ---------- */
  header{background:var(--panel);border-bottom:1px solid var(--line)}
  header .wrap{padding-top:4.5rem;padding-bottom:3rem}
  h1{margin:0 0 1rem;font-size:clamp(2.2rem,6vw,3.5rem);line-height:1.05;font-weight:700;letter-spacing:-.035em}
  .lead{max-width:36rem;margin:0 0 1.75rem;color:var(--muted);font-size:1.05rem}
  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
  .count{font:.85rem var(--mono);color:var(--muted)}

  .btn,.switch{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-radius:8px;
               font-weight:600;font-size:.95rem;text-decoration:none;
               transition:background .15s,border-color .15s,color .15s}

  /* Profilo GitHub: pulsante neutro */
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .btn:hover{border-color:var(--accent);background:var(--accent-soft)}

  /* Passa all'altro sito: pulsante colorato */
  .switch{border:1px solid var(--sw-line);background:var(--sw-bg);color:var(--sw-ink)}
  .switch:hover{background:var(--sw-hover);border-color:var(--sw-hover);color:var(--sw-hover-ink)}

  /* ---------- Progetti ---------- */
  main{padding:3rem 0 5rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(18.5rem,1fr));gap:1.25rem;margin:0;padding:0;list-style:none}
  .card{display:flex;flex-direction:column;height:100%;padding:1.4rem;
        background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
  .card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
  .card:focus-visible{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px var(--accent)}
  .card h2{margin:0 0 .5rem;font-size:1.1rem;line-height:1.3;font-weight:650;letter-spacing:-.01em;word-break:break-word}
  .card p{flex:1;margin:0 0 1.25rem;color:var(--muted);font-size:.95rem}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:.75rem;
        padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
  .lang{display:inline-flex;align-items:center;gap:.4rem;color:var(--ink);font-weight:550}
  .lang i{width:.6rem;height:.6rem;border-radius:50%;background:var(--accent)}

  /* ---------- Stati ---------- */
  .state{padding:3rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
  .skeleton{height:10rem;border:1px solid var(--line);border-radius:var(--radius);
            background:linear-gradient(90deg,var(--panel),var(--accent-soft),var(--panel)) 0 0/200% 100%;
            animation:shimmer 1.4s linear infinite}
  @keyframes shimmer{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  footer{padding:1.5rem 0;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Progetti 5IA</h1>
    <p class="lead">Una raccolta dei miei lavori più recenti, aggiornata in automatico dai repository GitHub.</p>
    <div class="actions">
      <a class="switch" href="https://mesko.altervista.org">Passa al sito Altervista</a>
      <a class="btn" href="https://github.com/meskrebooted">Profilo GitHub</a>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="state" id="notice" hidden></p>
  <ul class="grid" id="list" aria-label="Elenco progetti">
    <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
  </ul>
</main>

<footer><div class="wrap">Dati letti dall'API pubblica di GitHub.</div></footer>

<script>
  const USERNAME = "meskrebooted";
  const FILTRO = "-5IA"; // mostra solo i repo con questo testo nel nome

  const list = document.getElementById("list");
  const count = document.getElementById("count");
  const notice = document.getElementById("notice");

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const date = d => new Date(d).toLocaleDateString("it-IT", {day:"numeric", month:"short", year:"numeric"});

  function showMessage(text) {
    list.replaceChildren();
    count.textContent = "";
    notice.textContent = text;
    notice.hidden = false;
  }

  function card(repo) {
    return `
      <li><a class="card" href="${esc(repo.html_url)}">
        <h2>${esc(repo.name)}</h2>
        <p>${esc(repo.description) || "Nessuna descrizione."}</p>
        <div class="meta">
          <span class="lang">${repo.language ? `<i></i>${esc(repo.language)}` : ""}</span>
          <span>Aggiornato ${date(repo.pushed_at)}</span>
        </div>
      </a></li>`;
  }

  // sort=pushed: dal repo aggiornato più di recente al meno recente
  fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=pushed`)
    .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(repos => {
      const progetti = repos.filter(r => r.name.toLowerCase().includes(FILTRO.toLowerCase()));
      if (!progetti.length) return showMessage(`Nessun progetto con "${FILTRO}" nel nome, per ora.`);
      count.textContent = progetti.length + (progetti.length === 1 ? " progetto" : " progetti");
      list.innerHTML = progetti.map(card).join("");
    })
    .catch(() => showMessage("Impossibile caricare i progetti da GitHub. Ricarica la pagina tra qualche minuto."));
</script>
</body>
</html>
